<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login - Alunan Nusantara</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://paowtmytttinwndebftm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2-SfXv7pLRiDhTOJyAzDdg_SDZnj7ji";
    var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  </script>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lily+Script+One&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .navbar-pill {
      background: white;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(44, 20, 8, 0.12);
      height: 52px;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .navbar-wrapper { transition: padding 0.3s ease; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.88); }
      70%  { transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-fade-up { opacity: 0; animation: fadeSlideUp 0.6s ease forwards; }
    .anim-pop-in  { opacity: 0; animation: popIn 0.55s cubic-bezier(.34,1.56,.64,1) forwards; }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            lily: ['Lily Script One', 'cursive'],
          },
          colors: {
            'brown-primary': '#2d1109',
            'brand-dark': '#2c1408',
            'brand-brown': '#260701',
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-[#fff8f4] flex flex-col font-sans antialiased overflow-x-hidden">

  <!-- NAVBAR -->
  <nav class="w-full sticky top-0 z-50 py-4 navbar-wrapper" id="main-nav">
    <div class="max-w-7xl mx-auto px-8">
      <div class="navbar-pill anim-pop-in" style="justify-content: space-between; width: 100%; padding: 0 24px 0 20px;">
        <img alt="Alunan Nusantara Logo" class="h-10" src="assets/images/logo/logoweb.png"/>
        <div class="flex items-center gap-8">
          <a href="index.html"         class="text-sm hover:opacity-60 transition-opacity" style="color:#260701;">Beranda</a>
          <a href="provinsi.html" class="text-sm hover:opacity-60 transition-opacity" style="color:#260701;">Jelajahi</a>
          <a href="hubungi.html"        class="text-sm hover:opacity-60 transition-opacity" style="color:#260701;">Hubungi kami</a>
          <a href="login.html"          class="text-sm font-semibold hover:opacity-60 transition-opacity" style="color:#260701; border-bottom: 2px solid #260701; padding-bottom: 2px;">Masuk</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row anim-fade-up delay-100">

      <!-- LEFT: Ilustrasi -->
      <section class="w-full md:w-1/2 flex items-center justify-center py-10 px-8 bg-[#fff8f4]">
        <img alt="Character illustration" class="max-w-full max-h-[420px] object-contain drop-shadow-xl" src="assets/images/background/animbg.png"/>
      </section>

      <!-- RIGHT: Login Form -->
      <section class="w-full md:w-1/2 bg-white p-8 md:p-12 flex flex-col justify-center">

        <div class="text-center mb-8">
          <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2 tracking-tight">Selamat Datang!</h1>
          <p class="text-sm text-gray-500">Masuk ke akun anda untuk mengakses semua layanan</p>
        </div>

        <form id="login-form" class="space-y-6">

          <!-- Email -->
          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-2" for="email">Email</label>
            <div class="relative flex items-end border-b border-gray-400 focus-within:border-gray-900 pb-2 transition-colors">
              <div class="absolute inset-y-0 left-0 flex items-end pb-2 pointer-events-none">
                <i class="fa-solid fa-envelope text-gray-800 text-lg"></i>
              </div>
              <input class="block w-full pl-8 pr-3 py-1 border-0 bg-transparent text-sm placeholder-gray-400 focus:ring-0 focus:outline-none"
                id="email" name="email" placeholder="Masukkan Email" required type="email"/>
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-2" for="password">Kata Sandi</label>
            <div class="relative flex items-end border-b border-gray-400 focus-within:border-gray-900 pb-2 transition-colors">
              <div class="absolute inset-y-0 left-0 flex items-end pb-2 pointer-events-none">
                <i class="fa-solid fa-lock text-gray-800 text-lg"></i>
              </div>
              <input class="block w-full pl-8 pr-3 py-1 border-0 bg-transparent text-sm placeholder-gray-400 focus:ring-0 focus:outline-none"
                id="password" name="password" placeholder="Masukkan Kata Sandi" required type="password"/>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between mt-2">
            <div class="flex items-center">
              <input checked class="h-4 w-4 border-gray-300 rounded cursor-pointer accent-black"
                id="remember-me" name="remember-me" type="checkbox"/>
              <label class="ml-2 block text-sm text-gray-900 cursor-pointer" for="remember-me">Ingatkan saya</label>
            </div>
            <a class="text-sm font-medium text-gray-900 hover:text-gray-700" href="#">Lupa Kata Sandi?</a>
          </div>

          <!-- Submit -->
          <div class="pt-2">
            <button id="btn-submit" class="w-full flex justify-center py-3 px-4 rounded-lg shadow-sm text-sm font-semibold text-white transition-colors hover:bg-opacity-90 focus:outline-none"
              style="background-color: #2d1109;" type="submit">
              Masuk
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="mt-8 mb-5 relative">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
          <div class="relative flex justify-center">
            <span class="px-4 bg-white text-sm text-gray-500">Masuk dengan</span>
          </div>
        </div>

        <!-- Google Login -->
        <div>
          <button id="btn-google"
            class="w-full flex items-center justify-center px-4 py-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors"
            type="button">
            <img alt="Google logo" class="h-4 w-4 mr-2" src="https://www.svgrepo.com/show/475656/google-color.svg"/>
            Masuk dengan Google
          </button>
        </div>

        <!-- Register Link -->
        <div class="mt-6 text-center text-sm text-gray-500">
          Belum punya akun?
          <a class="font-bold text-gray-900 hover:underline" href="register.html">Daftar sekarang</a>
        </div>

      </section>
    </div>
  </main>

  <script>
    // Navbar scroll shrink
    const nav = document.getElementById('main-nav');
    window.addEventListener('scroll', () => {
      nav.style.padding = window.scrollY > 20 ? '8px 0' : '16px 0';
    });

    // Kalau sudah login langsung ke index
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });

    // =====================================================
    // FIX: Helper — ambil profile lengkap & simpan ke localStorage (dengan id & joined_at)
    // =====================================================
    async function saveUserToLocalStorage(user) {
      const meta = user.user_metadata || {};

      // Ambil dari tabel profiles
      let { data: p } = await supabase
        .from('profiles')
        .select('full_name, username, photo_url, joined_at')
        .eq('id', user.id)
        .single();

      // Jika joined_at belum ada di profiles, isi sekarang pakai created_at dari auth
      if (p && !p.joined_at) {
        const joinedAt = user.created_at;
        await supabase
          .from('profiles')
          .update({ joined_at: joinedAt })
          .eq('id', user.id);
        if (p) p.joined_at = joinedAt;
      }

      const stored = {
        id:       user.id,                                                          // FIX: simpan id
        name:     p?.full_name  || meta.full_name || meta.name || user.email.split('@')[0],
        username: p?.username   || meta.username  || user.email.split('@')[0],
        email:    user.email,
        joined:   p?.joined_at  || user.created_at,                                // FIX: pakai joined_at dari profiles
        photo:    p?.photo_url  || meta.avatar_url || meta.picture || '',
      };
      localStorage.setItem('an_user', JSON.stringify(stored));
      return stored;
    }

    // LOGIN Email & Password
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-submit');
      if (!email || !password) return;

      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      btn.textContent = 'Masuk';

      if (error) {
        if (error.message.includes('Email not confirmed')) {
          alert('Email belum dikonfirmasi.\nCek inbox/spam lalu klik link konfirmasi.');
        } else if (error.message.includes('Invalid login credentials')) {
          alert('Email atau kata sandi salah.');
        } else {
          alert('Login gagal: ' + error.message);
        }
        return;
      }

      await saveUserToLocalStorage(data.user);  // FIX: pakai helper
      window.location.href = 'index.html';
    });

    // LOGIN Google
    document.getElementById('btn-google').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/index.html' }
      });
      if (error) alert('Login Google gagal: ' + error.message);
    });

    // Handle balik dari Google OAuth
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session) {
        await saveUserToLocalStorage(session.user);  // FIX: pakai helper
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
